name: Build and source checks
on:
  push:
    branches: [development, fix]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/IbdaaAtelier.Web/IbdaaAtelier.Web.csproj
      - name: Build
        run: dotnet build src/IbdaaAtelier.Web/IbdaaAtelier.Web.csproj --configuration Release --no-restore
      - name: Verify invoice files in published application
        run: |
          dotnet publish src/IbdaaAtelier.Web/IbdaaAtelier.Web.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/ibdaa-publish"
          test -s "$RUNNER_TEMP/ibdaa-publish/Reports/DataSets/InvoiceDataSet.xsd"
          test -s "$RUNNER_TEMP/ibdaa-publish/Reports/InvoiceA4.rdlc"
          test -s "$RUNNER_TEMP/ibdaa-publish/Reports/Invoice80mm.rdlc"
      - name: Public-page HTTP and RTL smoke
        run: bash tests/http-smoke.sh
      - name: POS JavaScript syntax
        run: node --check src/IbdaaAtelier.Web/wwwroot/js/pos.js
      - name: Gallery JavaScript syntax
        run: node --check src/IbdaaAtelier.Web/wwwroot/js/product-gallery.js
      - name: Payment JavaScript syntax
        run: node --check src/IbdaaAtelier.Web/wwwroot/js/payments.js
      - name: Source contract tests
        run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-responsive-screenshots
          path: tests/ui-output/login-*.png
          if-no-files-found: warn
          retention-days: 7

  sql-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: SQL Server 2022 migrations, constraints and EF Core integration
        run: bash tests/sql/run-smoke.sh

  invoice-render:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Render bilingual invoice A4 and 80mm PDF
        run: dotnet run --project tests/InvoiceSmoke/InvoiceSmoke.csproj --configuration Release
        env:
          INVOICE_SMOKE_OUTPUT: tests/InvoiceSmoke/output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-rdlc-test-pdfs
          path: tests/InvoiceSmoke/output/*-TEST.pdf
          if-no-files-found: warn
          retention-days: 7
